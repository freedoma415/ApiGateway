server:
  port: 8082

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      # 🚨 NEW: The Global CORS Policy
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: Product
          uri: lb://PRODUCT
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/order, /api/order/**

  management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    tags:
      application: ${spring.application.name} # This helps Grafana tell them apart!          
            
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/